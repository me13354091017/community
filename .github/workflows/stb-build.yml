name: STB Desktop Build

# School Tools Board（STB）桌面版构建：
# 以 ICC-CE 源码为基础，构建前用脚本打品牌补丁（程序名 / 窗口标题 / 图标），
# 不改动任何源码文件，所以永远不会跟上游冲突。

on:
  workflow_dispatch:
  push:
    branches: [ net10 ]
    paths:
      - '.github/workflows/stb-build.yml'
      - 'stb/**'

permissions:
  contents: read

concurrency:
  group: stb-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build STB package
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Log($m) { Write-Host $m; $m | Out-File -FilePath steps.log -Append -Encoding utf8 }
          Log "PHASE 0 dotnet=$(dotnet --version)"

          Log 'PHASE 1 restore'
          dotnet restore "Ink Canvas/InkCanvasForClass.csproj" --locked-mode *>&1 | Out-File -FilePath restore.log -Encoding utf8
          Log "restore exit=$LASTEXITCODE"

          Log 'PHASE 2 brand patch'
          $csproj = "Ink Canvas/InkCanvasForClass.csproj"
          $s = Get-Content $csproj -Raw
          $s = $s -replace '<AssemblyName>InkCanvasForClass</AssemblyName>', '<AssemblyName>SchoolToolsBoard</AssemblyName>'
          Set-Content -LiteralPath $csproj -Value $s -NoNewline -Encoding utf8
          $xaml = "Ink Canvas/MainWindow.xaml"
          $x = Get-Content $xaml -Raw
          $x = $x -replace 'Title="InkCanvasforClass"', 'Title="School Tools Board · 课堂白板"'
          Set-Content -LiteralPath $xaml -Value $x -NoNewline -Encoding utf8
          Log "patch ok; $(Select-String -Path $csproj -Pattern 'AssemblyName').Line.Trim()"

          Log 'PHASE 3 icon'
          try { choco install imagemagick -y --no-progress *>&1 | Out-Null } catch { Log "choco fail: $_" }
          if (Get-Command magick -ErrorAction SilentlyContinue) {
            magick -background none "stb/icon.svg" -define icon:auto-resize=256,128,64,48,32,16 "Ink Canvas/Resources/icc.ico" 2>&1 | Out-File -FilePath icon.log -Encoding utf8
            Log "icon exit=$LASTEXITCODE"
          } else { Log 'magick not found, keep upstream icon' }

          Log 'PHASE 4 build'
          $mb = Get-Command msbuild -ErrorAction SilentlyContinue
          Log "msbuild=$($mb.Source)"
          if ($mb) {
            & $mb.Source "Ink Canvas/InkCanvasForClass.csproj" /p:Configuration=Release /p:Platform=x64 /m /p:RunAnalyzers=false /verbosity:minimal *>&1 | Out-File -FilePath build.log -Encoding utf8
            Log "build exit=$LASTEXITCODE"
          } else {
            Log 'msbuild missing, fallback to dotnet build'
            dotnet build "Ink Canvas/InkCanvasForClass.csproj" -c Release -p:Platform=x64 *>&1 | Out-File -FilePath build.log -Encoding utf8
            Log "dotnet build exit=$LASTEXITCODE"
          }

          Log 'PHASE 5 collect output'
          Get-ChildItem "Ink Canvas/bin" -Recurse -Depth 4 -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Out-File -FilePath hint.txt -Encoding utf8
          $dirs = @(
            "Ink Canvas/bin/Release/x64/net10.0-windows10.0.19041.0",
            "Ink Canvas/bin/Release/AnyCPU/net10.0-windows10.0.19041.0",
            "Ink Canvas/bin/Release/x64/net6.0-windows10.0.19041.0"
          )
          $out = $dirs | Where-Object { Test-Path $_ } | Select-Object -First 1
          Log "output dir=$out"
          if ($out) {
            Get-ChildItem $out -Filter *.exe | Select-Object Name, Length | Out-String | ForEach-Object { Log $_ }
            Compress-Archive -Path "$out/*" -DestinationPath "SchoolToolsBoard-STB-win-x64.zip" -Force
            Log "zip=$((Get-Item 'SchoolToolsBoard-STB-win-x64.zip').Length) bytes"
          } else { Log 'NO OUTPUT DIR'; exit 1 }
          exit 0

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolToolsBoard-STB-win-x64
          path: SchoolToolsBoard-STB-win-x64.zip
          if-no-files-found: error

      - name: Publish diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @('steps.log','restore.log','build.log','icon.log','hint.txt')) {
            if (Test-Path $f) {
              try { $u = (Invoke-WebRequest -Method Post -InFile $f -Uri 'https://paste.rs' -UseBasicParsing).Content.Trim(); Write-Host "::notice::$f -> $u" } catch { Write-Host "::warning::$f upload failed" }
            } else { Write-Host "::warning::missing $f" }
          }
          if (Test-Path build.log) {
            Get-Content build.log | Select-String -Pattern ': error|error NU|error MSB|error CS' | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          }
          exit 0
