name: STB Desktop Build

# School Tools Board（STB）桌面版构建：
# 以 ICC-CE 源码为基础，构建前用脚本打品牌补丁（程序名 / 窗口标题 / 图标），
# 不改动任何源码文件，所以永远不会跟上游冲突。

on:
  workflow_dispatch:
  push:
    branches: [ net10 ]
    paths:
      - '.github/workflows/stb-build.yml'
      - 'stb/**'

permissions:
  contents: read

concurrency:
  group: stb-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore main project (locked)
        shell: pwsh
        run: |
          dotnet restore "Ink Canvas/InkCanvasForClass.csproj" --locked-mode *>&1 | Out-File -FilePath restore.log -Encoding utf8
          Write-Host "restore exit=$LASTEXITCODE"
          exit 0

      - name: Apply STB brand patch
        shell: pwsh
        run: |
          $csproj = "Ink Canvas/InkCanvasForClass.csproj"
          $s = Get-Content $csproj -Raw
          $s = $s -replace '<AssemblyName>InkCanvasForClass</AssemblyName>', '<AssemblyName>SchoolToolsBoard</AssemblyName>'
          Set-Content -LiteralPath $csproj -Value $s -NoNewline -Encoding utf8

          $xaml = "Ink Canvas/MainWindow.xaml"
          $x = Get-Content $xaml -Raw
          $x = $x -replace 'Title="InkCanvasforClass"', 'Title="School Tools Board · 课堂白板"'
          Set-Content -LiteralPath $xaml -Value $x -NoNewline -Encoding utf8

          Select-String -Path $csproj -Pattern 'AssemblyName' | ForEach-Object { Write-Host "::notice::$($_.Line.Trim())" }
          exit 0

      - name: Generate STB app icon
        continue-on-error: true
        shell: pwsh
        run: |
          choco install imagemagick -y --no-progress | Out-Null
          magick -background none "stb/icon.svg" -define icon:auto-resize=256,128,64,48,32,16 "Ink Canvas/Resources/icc.ico"
          Write-Host "icon exit=$LASTEXITCODE"
          Get-Item "Ink Canvas/Resources/icc.ico" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          exit 0

      - name: Build (Release x64)
        shell: pwsh
        run: |
          msbuild "Ink Canvas/InkCanvasForClass.csproj" /p:Configuration=Release /p:Platform=x64 /m /p:RunAnalyzers=false /verbosity:minimal *>&1 | Out-File -FilePath build.log -Encoding utf8
          Write-Host "build exit=$LASTEXITCODE"
          exit 0

      - name: Package
        shell: pwsh
        run: |
          $dirs = @(
            "Ink Canvas/bin/Release/x64/net10.0-windows10.0.19041.0",
            "Ink Canvas/bin/Release/AnyCPU/net10.0-windows10.0.19041.0",
            "Ink Canvas/bin/Release/x64/net6.0-windows10.0.19041.0"
          )
          $out = $dirs | Where-Object { Test-Path $_ } | Select-Object -First 1
          "bin tree:" | Out-File -FilePath hint.txt -Encoding utf8
          Get-ChildItem "Ink Canvas/bin" -Recurse -Depth 4 -ErrorAction SilentlyContinue |
            Select-Object FullName | Out-File -FilePath hint.txt -Append -Encoding utf8
          if (-not $out) { Write-Host 'no output dir'; exit 1 }
          Get-ChildItem $out -Filter *.exe | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          Compress-Archive -Path "$out/*" -DestinationPath "SchoolToolsBoard-STB-win-x64.zip" -Force
          Get-Item "SchoolToolsBoard-STB-win-x64.zip" | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          exit 0

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SchoolToolsBoard-STB-win-x64
          path: SchoolToolsBoard-STB-win-x64.zip
          if-no-files-found: error

      - name: Publish diagnostics
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @('build.log','restore.log','hint.txt')) {
            if (Test-Path $f) {
              try { $u = (Invoke-WebRequest -Method Post -InFile $f -Uri 'https://paste.rs' -UseBasicParsing).Content.Trim(); Write-Host "::notice::$f -> $u" } catch { Write-Host "::warning::$f upload failed" }
            }
          }
          if (Test-Path build.log) {
            Get-Content build.log | Select-String -Pattern ': error|error NU|error MSB|error CS' | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }
          }
          exit 0
