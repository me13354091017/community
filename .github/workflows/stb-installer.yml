name: STB Installer

# 把 stb-build 产出的 zip 打成 Windows 安装包（Inno Setup），上传到 stb-latest。
# 与构建解耦：构建产物变了重跑本工作流即可重新出包。

on:
  workflow_dispatch:
  push:
    branches: [ net10 ]
    paths:
      - '.github/workflows/stb-installer.yml'
      - 'stb/setup.iss'

permissions:
  contents: write

concurrency:
  group: stb-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      APPVER: '1.1.3'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          gh release download stb-latest -p 'SchoolToolsBoard-STB-win-x64.zip' -D pkg --clobber
          Get-ChildItem pkg | Format-Table Name, Length

      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive -Path 'pkg/SchoolToolsBoard-STB-win-x64.zip' -DestinationPath app -Force
          if (-not (Test-Path 'app/SchoolToolsBoard.exe')) { Write-Host 'main exe missing'; exit 1 }
          Write-Host ("ppt-agent files: " + (Get-ChildItem 'app/ppt-agent' -File -ErrorAction SilentlyContinue).Count)
          Write-Host ("icon: " + (Test-Path 'app/Resources/icc.ico'))

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { Write-Host 'ISCC not found'; exit 1 }
          & $iscc /? | Select-Object -First 3

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          $defs = @("/DAppVersion=$env:APPVER", "/DAppDir=$PWD\app", "/O$PWD\out")
          if (Test-Path 'app/Resources/icc.ico') { $defs += "/DIconFile=$PWD\app\Resources\icc.ico" }
          & $iscc @defs 'stb\setup.iss' *>&1 | Tee-Object -FilePath iscc.log | Out-Host
          $code = $LASTEXITCODE
          Write-Host "iscc exit=$code"
          if ($code -ne 0) { Get-Content iscc.log; exit 1 }
          $exe = "out/SchoolToolsBoard-STB-Setup-$env:APPVER.exe"
          if (-not (Test-Path $exe)) { Get-ChildItem out; exit 1 }
          Get-Item $exe | Format-List Name, Length

      - name: Upload to stb-latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $exe = "out/SchoolToolsBoard-STB-Setup-$env:APPVER.exe"
          gh release upload stb-latest $exe --clobber
          gh release view stb-latest --json assets -q '.assets[].name'
          exit 0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchoolToolsBoard-STB-Setup
          path: out/SchoolToolsBoard-STB-Setup-*.exe
          if-no-files-found: warn
